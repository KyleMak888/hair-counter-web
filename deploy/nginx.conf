user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'request_time=$request_time';
    access_log /var/log/nginx/access.log main;

    # Per-IP protection for CPU-bound image processing.
    limit_req_zone $binary_remote_addr zone=hair_api_per_ip:10m rate=12r/m;
    limit_conn_zone $binary_remote_addr zone=hair_conn_per_ip:10m;

    upstream hair_backend {
        server backend:8000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        client_max_body_size 20m;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; script-src 'self'; style-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

        location = /api/count/batch {
            client_max_body_size 200m;
            limit_req zone=hair_api_per_ip burst=2 nodelay;
            limit_conn hair_conn_per_ip 1;

            proxy_pass http://hair_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 5s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            proxy_request_buffering on;
            proxy_buffering off;

            expires -1;
        }

        location /api/ {
            limit_req zone=hair_api_per_ip burst=4 nodelay;
            limit_conn hair_conn_per_ip 2;

            proxy_pass http://hair_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_request_buffering on;
            proxy_buffering off;

            expires -1;
        }

        location = /healthz {
            proxy_pass http://hair_backend/api/health;
            access_log off;
        }

        location ~* \.(?:css|js|png|jpg|jpeg|webp|svg|ico)$ {
            expires 1h;
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
            expires -1;
        }
    }
}
